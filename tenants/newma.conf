# newma tenant override — points at THIS current install.
# This is the existing running Hermes (repo at /opt/jsec, runtime data at $HOME/.hermes).
# It exists so tenant.sh treats newma uniformly with other tenants, without relocating it.

TENANT_NAME=newma
TENANT_ROOT=/opt/jsec
TENANT_DATA=$HOME/.hermes
TENANT_IMAGE=newma-assistant
TENANT_MEM_LIMIT=4g
TENANT_CPU_LIMIT=2

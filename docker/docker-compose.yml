# Run a Hermes gateway inside Docker (zero host deps besides Docker + git).
# Manage via: scripts/tenant.sh {up|down|restart|logs|status|build} <tenant>
#
# Multi-tenant: each tenant is an isolated Hermes instance with its OWN:
#   - data dir   (sessions, memories, .env, skills, logs)  -> mounted at /opt/data
#   - repo dir   (config/SOUL/.env source, read-write)     -> mounted at /opt/jsec
#   - container name and image tag
# A tenant is chosen via the TENANT env var (set by scripts/tenant.sh).
# Isolation between tenants is complete: separate .env, separate state.db,
# separate memory/skills, separate bot token. No shared state.

services:
  gateway:
    build:
      context: ${JSEC_ROOT:-.}
      dockerfile: docker/Dockerfile
    image: ${TENANT_IMAGE:-jsec-assistant}:latest
    container_name: ${TENANT_NAME:-hermes-gateway}
    restart: unless-stopped

    # No network_mode: host — Docker Desktop on macOS has limited support for it,
    # and Telegram long-polling is outbound-only, so bridge networking works.
    volumes:
      # Tenant runtime data (sessions, memories, .env, skills, logs)
      - ${TENANT_DATA:-$HOME/.hermes}:/opt/data
      # Tenant repo (config/soul/skills/.env source) — read-write
      - ${TENANT_ROOT:-${JSEC_ROOT:-.}}:/opt/jsec

    # No docker.sock, no privileged, no host network/pid — the container can
    # only reach the two mounted dirs (~/.hermes and the repo) plus outbound net.
    # Hardening: resource limits (a runaway agent can't starve the host),
    # process cap, and no-new-privileges.
    deploy:
      resources:
        limits:
          memory: ${TENANT_MEM_LIMIT:-4g}
          cpus: '${TENANT_CPU_LIMIT:-2}'
          pids: 256
    security_opt:
      - no-new-privileges:true

    environment:
      # Remap the container user to the host owner
      - HERMES_UID=${HERMES_UID:-$(id -u)}
      - HERMES_GID=${HERMES_GID:-$(id -g)}
      - HERMES_REAL_HOME=${HERMES_REAL_HOME:-$HOME}
      # Inside the container the repo is always mounted here (host path is the volume source above)
      - JSEC_ROOT=/opt/jsec
      # Allow file tools to write into runtime data and the repo mount
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/opt/jsec
      # Optional: route outbound traffic through a local VPN proxy (e.g. Clash on host).
      # Set HTTP_PROXY/HTTPS_PROXY in .env to http://host.docker.internal:<port>.
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1,host.docker.internal}
      - no_proxy=${NO_PROXY:-localhost,127.0.0.1,::1,host.docker.internal}

    command: ["gateway", "run"]

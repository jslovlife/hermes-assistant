# Hermes assistant profile — OpenCode Go (all models) + Telegram.
# Applied to ~/.hermes/config.yaml by the container auto-seeder on first boot.

model:
  provider: opencode-go
  default: deepseek-v4-flash

network:
  # Prefer IPv4 only. Fixes Telegram connection hangs on Docker Desktop (macOS)
  # where the container VM has no working IPv6 route: api.telegram.org returns
  # AAAA records first, so the Python stack hangs on IPv6 before falling back.
  force_ipv4: true

agent:
  # Thinking (main agent) on DeepSeek V4 Flash; coding via pi on DeepSeek V4 Pro.
  reasoning_effort: low

fallback_providers:
  - provider: opencode-go
    model: deepseek-v4-pro

auxiliary:
  compression:
    provider: opencode-go
    model: deepseek-v4-flash
  background_review:
    provider: opencode-go
    model: deepseek-v4-flash
  title_generation:
    # Disabled: opencode-go's Console Go endpoint doesn't support the JSON
    # response_format Hermes uses for auto-titles, so every title call errored
    # and triggered noisy OpenRouter/Nous fallback warnings. Sessions still work.
    enabled: false
    provider: opencode-go
    model: deepseek-v4-flash

terminal:
  backend: local
  cwd: "/opt/jsec/workspaces"
  timeout: 300
  home_mode: auto

memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: true

skills:
  write_approval: true

display:
  tool_progress: new
  show_reasoning: false
  platforms:
    telegram:
      tool_progress: new
      notifications: important

stt:
  enabled: true
  echo_transcripts: true
  provider: local

delegation:
  max_concurrent_children: 2
  provider: opencode-go
  model: deepseek-v4-pro

gateway:
  streaming: true

platforms:
  telegram:
    extra:
      status_indicator: true
      guest_mode: true
      require_mention: false
      command_menu:
        max_commands: 40
        priority_mode: prepend
        priority:
          - help
          - status
          - topic
          - learn
          - memory
          - skills